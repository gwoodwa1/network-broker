name: Extended test and security

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "41 4 * * 1"

permissions:
  contents: read

env:
  EXPECTED_GO_VERSION: go1.27.1
  GOVULNCHECK_VERSION: v1.7.0

jobs:
  test:
    name: Coverage and binary security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify Go toolchain
        run: |
          go version
          go env GOVERSION GOTOOLCHAIN GOPROXY GOSUMDB
          test "$(go env GOVERSION)" = "${EXPECTED_GO_VERSION}"

      - name: Verify dependency files
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Run strict golangci-lint checks
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: --timeout=5m

      - name: Enforce constructor usage
        run: go run ./internal/tools/constructorcheck

      - name: Test with race detector and coverage
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out

      - name: Fuzz normalisation
        run: go test ./internal/normalise -run=^$ -fuzz=FuzzGNMIInterfaceStateTransform -fuzztime=10s

      - name: Fuzz sanitisation
        run: go test ./internal/sanitise -run=^$ -fuzz=FuzzPipelineTransform -fuzztime=10s

      - name: Install govulncheck
        run: |
          mkdir -p "${RUNNER_TEMP}/security-tools"
          GOBIN="${RUNNER_TEMP}/security-tools" go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          echo "${RUNNER_TEMP}/security-tools" >> "${GITHUB_PATH}"

      - name: Go source vulnerability scan
        run: govulncheck -show verbose ./...

      - name: Go test vulnerability scan
        run: govulncheck -test -show verbose ./...

      - name: Build and scan every command binary
        run: scripts/scan-go-binaries.sh "${RUNNER_TEMP}/security-scan"

      - name: Security static analysis
        run: go run github.com/securego/gosec/v2/cmd/gosec@v2.25.0 -exclude-generated -severity high ./...

      - name: Upload coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-coverage
          path: coverage.out
          if-no-files-found: error

  container-security:
    name: Container security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify Go toolchain
        run: |
          go version
          go env GOVERSION GOTOOLCHAIN GOPROXY GOSUMDB
          test "$(go env GOVERSION)" = "${EXPECTED_GO_VERSION}"

      - name: Install govulncheck
        run: |
          mkdir -p "${RUNNER_TEMP}/security-tools"
          GOBIN="${RUNNER_TEMP}/security-tools" go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          echo "${RUNNER_TEMP}/security-tools" >> "${GITHUB_PATH}"

      - name: Build runtime images
        run: |
          docker build --target collector --tag network-broker-collector:security-scan .
          docker build --target controlplane --tag network-broker-controlplane:security-scan .

      - name: Extract and scan embedded Go binaries
        run: |
          collector_id="$(docker create network-broker-collector:security-scan)"
          controlplane_id="$(docker create network-broker-controlplane:security-scan)"
          trap 'docker rm -f "${collector_id}" "${controlplane_id}" >/dev/null' EXIT
          docker cp "${collector_id}:/collector" "${RUNNER_TEMP}/collector"
          docker cp "${controlplane_id}:/controlplane" "${RUNNER_TEMP}/controlplane"
          go version -m "${RUNNER_TEMP}/collector"
          govulncheck -mode binary "${RUNNER_TEMP}/collector"
          go version -m "${RUNNER_TEMP}/controlplane"
          govulncheck -mode binary "${RUNNER_TEMP}/controlplane"

      - name: Scan collector runtime image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: network-broker-collector:security-scan
          format: table
          exit-code: "1"
          ignore-unfixed: false
          severity: CRITICAL,HIGH

      - name: Scan control-plane runtime image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: network-broker-controlplane:security-scan
          format: table
          exit-code: "1"
          ignore-unfixed: false
          severity: CRITICAL,HIGH
